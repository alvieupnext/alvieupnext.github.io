<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications - Papers</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <link rel="stylesheet" href="styles.css">
  <script src="/papers-data.js"></script>
</head>
<body>

<div class="page-container papers-layout">
  
  <div class="top-nav-bar">
    <a href="/landing.html" class="back-btn top-back-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Menu
    </a>
  </div>

  <div class="sort-controls-stylized">
    <div class="sort-toggle" id="sortToggle" onclick="toggleSort()">
      <div class="sort-slider"></div>
      <button id="btnNewest" class="sort-btn active">Newest First</button>
      <button id="btnOldest" class="sort-btn">Oldest First</button>
    </div>
  </div>

  <div class="papers-list" id="papersList">
    <!-- Populated dynamically by script -->
  </div>

</div>

<script>
let currentSort = 'newest';

function renderPapers() {
  const list = document.getElementById('papersList');
  list.innerHTML = '';
  
  const sorted = [...papersData].sort((a, b) => {
    const dA = new Date(a.date);
    const dB = new Date(b.date);
    return currentSort === 'newest' ? dB - dA : dA - dB;
  });
  
  // Find chronologically newest for tags
  const chronologicallyNewest = [...papersData].sort((a, b) => new Date(b.date) - new Date(a.date))[0];

  sorted.forEach(paper => {
    const isLatest = paper === chronologicallyNewest;
    const card = document.createElement('div');
    card.className = 'paper-card';
    card.setAttribute('data-date', paper.date);

    let tagsHtml = '';
    if (isLatest) {
      tagsHtml += `<span class="tag" style="background: #ffd54f; color: #b28900; margin-right: 12px;">Latest Publication</span>`;
    }
    tagsHtml += `<span class="tag">Date: ${paper.displayDate}</span>`;

    let actionFooterHtml = `
        <a href="${paper.link}" target="_blank" class="read-btn">
          Paper
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
        </a>`;

    card.innerHTML = `
      <div class="header">
        ${tagsHtml}
      </div>
      <h1 class="title">${paper.title}</h1>
      <div class="abstract-section">
        <h3>Summary</h3>
        <p class="abstract">${paper.abstract}</p>
      </div>
      <div class="action-footer">
        ${actionFooterHtml}
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleSort() {
  currentSort = currentSort === 'newest' ? 'oldest' : 'newest';
  
  document.getElementById('btnNewest').classList.toggle('active', currentSort === 'newest');
  document.getElementById('btnOldest').classList.toggle('active', currentSort === 'oldest');
  document.getElementById('sortToggle').classList.toggle('is-oldest', currentSort === 'oldest');
  
  renderPapers();
}

window.onload = () => {
  renderPapers();
};
</script>

</body>
</html>
